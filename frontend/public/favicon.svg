<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ambient Glow Behind Document -->
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Document Card Gradient -->
    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Header Banner Gradient (Emerald / Teal) -->
    <linearGradient id="banner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Accent Floating Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Badge Shadow -->
    <filter id="shadow-badge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)" />

  <!-- Inner Border / Bevel -->
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.3" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#glow)" />

  <!-- Main Invoice Document Sheet -->
  <g filter="url(#shadow-card)">
    <!-- Document Body -->
    <rect x="116" y="84" width="280" height="344" rx="26" fill="url(#doc-grad)" />

    <!-- Top Header Banner on Document -->
    <path d="M 116 110 A 26 26 0 0 1 142 84 L 370 84 A 26 26 0 0 1 396 110 L 396 160 L 116 160 Z" fill="url(#banner-grad)" />

    <!-- Document Header Icon / Text Lines -->
    <rect x="146" y="112" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.95" />
    <rect x="146" y="132" width="92" height="8" rx="4" fill="#ffffff" fill-opacity="0.75" />
    <circle cx="362" cy="122" r="14" fill="#ffffff" fill-opacity="0.25" />

    <!-- Invoice Spreadsheet Content Rows -->
    <!-- Row 1 -->
    <rect x="146" y="184" width="112" height="10" rx="5" fill="#334155" />
    <rect x="314" y="184" width="52" height="10" rx="5" fill="#047857" fill-opacity="0.9" />

    <!-- Row 2 -->
    <rect x="146" y="212" width="136" height="8" rx="4" fill="#64748b" />
    <rect x="326" y="212" width="40" height="8" rx="4" fill="#64748b" />

    <!-- Row 3 -->
    <rect x="146" y="238" width="96" height="8" rx="4" fill="#94a3b8" />
    <rect x="326" y="238" width="40" height="8" rx="4" fill="#94a3b8" />

    <!-- Row 4 -->
    <rect x="146" y="264" width="120" height="8" rx="4" fill="#cbd5e1" />
    <rect x="334" y="264" width="32" height="8" rx="4" fill="#cbd5e1" />

    <!-- Divider Line -->
    <line x1="146" y1="294" x2="366" y2="294" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

    <!-- Subtotal Row -->
    <rect x="146" y="314" width="70" height="8" rx="4" fill="#94a3b8" />
    <rect x="316" y="314" width="50" height="8" rx="4" fill="#64748b" />

    <!-- Grand Total Highlight Bar -->
    <rect x="146" y="342" width="220" height="34" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
    <rect x="160" y="354" width="56" height="10" rx="5" fill="#065f46" />
    <rect x="296" y="354" width="58" height="10" rx="5" fill="#059669" />
  </g>

  <!-- Floating Action Badge (Bottom Right) -->
  <g filter="url(#shadow-badge)">
    <circle cx="376" cy="376" r="48" fill="url(#badge-grad)" />
    <!-- Glowing Outer Ring -->
    <circle cx="376" cy="376" r="48" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.85" />

    <!-- Indian Rupee Symbol (₹) in White -->
    <path d="M 364 358 L 388 358 M 364 366 L 388 366 M 364 358 L 364 372 C 374 372 381 372 381 377 C 381 382 374 382 364 382 L 364 384 L 384 396 M 364 382 L 364 396" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
