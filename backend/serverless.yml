service: quote-invoice-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-south-1'}
  memorySize: 256
  timeout: 10
  environment:
    NODE_ENV: production
    MONGODB_URI: ${env:MONGODB_URI, ''}
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.md'
    - 'dist/**'
    - 'package.json'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY
