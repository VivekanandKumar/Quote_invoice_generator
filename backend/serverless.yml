service: quote-invoice-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-south-1'}
  memorySize: 1536 # Puppeteer & Chromium run best with at least 1536MB RAM on AWS Lambda
  timeout: 29
  environment:
    NODE_ENV: production
    MONGODB_URI: ${env:MONGODB_URI, ''}
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - Content-Disposition
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      exposedResponseHeaders:
        - Content-Disposition
  apiGateway:
    binaryMediaTypes:
      - 'application/pdf'
      - '*/*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.md'
    - 'dist/**'
    - 'bin/**'
    - 'node_modules/@sparticuz/chromium/**'
    - 'package.json'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY
